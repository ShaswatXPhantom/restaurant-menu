<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Maharaja's Darbar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to order & reserve</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="auth-footer">
        New guest? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('');
    document.getElementById('footer').innerHTML = renderFooter();

    function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const result = login(form.email.value, form.password.value);
      if (result.success) {
        showToast('Welcome, ' + result.user.name.split(' ')[0] + '!', 'success');
        setTimeout(() => {
          window.location.href = result.user.role === 'admin' ? 'admin.html' : 'products.html';
        }, 800);
      } else {
        showToast(result.message, 'error');
      }
    }
  </script>
</body>
</html>
