<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location & Contact | Radhe Radhe Restaurant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <section class="section">
    <div class="container">
      <h2 class="section-title">Find Us</h2>
      <p class="section-subtitle" id="contact-subtitle">Location, hours & reservations</p>
      <div id="location-area" style="margin-bottom:2.5rem"></div>
      <div style="max-width:520px;margin:0 auto">
        <div style="background:white;padding:2rem;border-radius:16px;box-shadow:var(--shadow);border-top:4px solid var(--gold)">
          <h3 style="margin-bottom:1rem;text-align:center">Reserve a Table</h3>
          <form onsubmit="handleContact(event)">
            <div class="form-group"><label>Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" name="phone" class="form-control" required></div>
            <div class="form-group"><label>Guests / Message</label>
              <textarea name="message" class="form-control" rows="3" placeholder="Number of guests, preferred time..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Request Reservation</button>
          </form>
        </div>
      </div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('contact');
    document.getElementById('footer').innerHTML = renderFooter();
    var s = getSettings();
    document.getElementById('contact-subtitle').textContent =
      (s.address || '') + (s.city ? ', ' + s.city : '') || 'Location, hours & reservations';
    document.getElementById('location-area').innerHTML = renderLocationBlock();
    document.title = 'Location & Contact | ' + (s.restaurantName || 'Radhe Radhe Restaurant');
    function handleContact(e) {
      e.preventDefault();
      showToast('Reservation request received! We will call you shortly. 🙏', 'success');
      e.target.reset();
    }
  </script>
</body>
</html>
