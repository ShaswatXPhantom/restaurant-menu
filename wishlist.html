<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favourites | Maharaja's Darbar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Your Favourites</h2>
      <p class="section-subtitle">Dishes you love</p>
      <div class="product-grid" id="wishlist-grid"></div>
      <div id="empty-wishlist" class="empty-state hidden">
        <p>No favourites yet. Browse the menu and tap the heart on dishes you love.</p>
        <a href="products.html" class="btn btn-primary mt-2">View Menu</a>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('wishlist');
    document.getElementById('footer').innerHTML = renderFooter();

    function loadWishlist() {
      const ids = getWishlist();
      const products = getProducts().filter(p => ids.includes(p.id));
      const grid = document.getElementById('wishlist-grid');
      const empty = document.getElementById('empty-wishlist');
      if (products.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = products.map(renderProductCard).join('');
      }
    }
    loadWishlist();
  </script>
</body>
</html>
