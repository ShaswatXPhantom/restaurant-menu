<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Radhe Radhe Restaurant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Our Menu</h2>
      <p class="section-subtitle">Pure vegetarian dishes made with devotion</p>

      <div class="filters-bar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search dishes, curries, desserts..." oninput="filterProducts()">
        </div>
        <select class="filter-select" id="category-filter" onchange="filterProducts()">
          <option value="">All Categories</option>
          <option value="Starters">Starters</option>
          <option value="Main Course">Main Course</option>
          <option value="Breads & Rice">Breads & Rice</option>
          <option value="Desserts">Desserts</option>
          <option value="Beverages">Beverages</option>
        </select>
        <select class="filter-select" id="sort-filter" onchange="filterProducts()">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name A-Z</option>
        </select>
        <select class="filter-select" id="stock-filter" onchange="filterProducts()">
          <option value="">All</option>
          <option value="in">Available</option>
          <option value="low">Limited</option>
        </select>
      </div>

      <div class="product-grid" id="products-grid"></div>
      <div id="no-results" class="empty-state hidden">
        <p>No dishes match your filters. Try adjusting search or category.</p>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = renderHeader('products');
    document.getElementById('footer').innerHTML = renderFooter();

    let allProducts = getProducts();

    function filterProducts() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const category = document.getElementById('category-filter').value;
      const sort = document.getElementById('sort-filter').value;
      const stock = document.getElementById('stock-filter').value;

      let filtered = allProducts.filter(p => {
        const matchSearch = !search || p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search) || (p.description || '').toLowerCase().includes(search);
        const matchCat = !category || p.category === category;
        let matchStock = true;
        if (stock === 'in') matchStock = p.stock > 0;
        if (stock === 'low') matchStock = p.stock > 0 && p.stock <= 10;
        return matchSearch && matchCat && matchStock;
      });

      if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
      else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
      else if (sort === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));

      const grid = document.getElementById('products-grid');
      const noRes = document.getElementById('no-results');
      if (filtered.length === 0) {
        grid.innerHTML = '';
        noRes.classList.remove('hidden');
      } else {
        noRes.classList.add('hidden');
        grid.innerHTML = filtered.map(renderProductCard).join('');
      }
    }

    filterProducts();
  </script>
</body>
</html>
